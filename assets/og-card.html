<!doctype html>
<!-- Source for og-image.png. Render: chrome --headless --screenshot=og-image.png --window-size=1200,630 assets/og-card.html -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Martel:wght@700;800&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#EEF2F7;color:#1B2A4A;font-family:'Public Sans',sans-serif;overflow:hidden}
  .card{position:relative;height:100%;box-sizing:border-box;padding:84px 96px;
    background:repeating-linear-gradient(#EEF2F7 0 47px,#C9D6E8 47px 48px)}
  .card::before{content:"";position:absolute;left:72px;top:0;bottom:0;border-left:2px solid #C8102E;opacity:.55}
  h1{font:800 84px/1.05 Martel,serif;margin:0 0 24px;max-width:700px}
  p{font-size:32px;line-height:1.4;margin:0;max-width:640px;color:#33456b}
  .url{position:absolute;left:96px;bottom:64px;font-size:26px;font-weight:600;color:#5B3FA0}
  .stamp{position:absolute;right:96px;top:150px;width:300px;height:300px;transform:rotate(-8deg)}
</style></head><body>
<div class="card">
  <h1>Nepal to US GPA</h1>
  <p>Convert your Tribhuvan University percentage to a credit-weighted 4.0 GPA.</p>
  <div class="url">gpa.hemantapkh.com</div>
  <svg class="stamp" viewBox="0 0 200 200">
    <circle cx="100" cy="100" r="92" fill="none" stroke="#5B3FA0" stroke-width="6"/>
    <circle cx="100" cy="100" r="78" fill="none" stroke="#5B3FA0" stroke-width="2"/>
    <text x="100" y="118" text-anchor="middle" font-family="Martel,serif" font-weight="800" font-size="56" fill="#5B3FA0">3.95</text>
    <text x="100" y="148" text-anchor="middle" font-family="Public Sans,sans-serif" font-weight="600" font-size="15" fill="#5B3FA0">on a 4.0 scale</text>
  </svg>
</div></body></html>
